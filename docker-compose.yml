version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: writeuppro-backend
    ports:
      - "8000:8000"
    environment:
      - SECRET_KEY=writeuppro-super-secure-production-secret-key-2026
      - DATABASE_PATH=/app/data/writeuppro.db
    volumes:
      - backend-data:/app/data
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: writeuppro-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  backend-data:
